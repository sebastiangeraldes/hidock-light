name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Reject unreviewed secrets
        shell: bash
        run: |
          python -m pip install detect-secrets
          git grep -Il -e . -- . | grep -v '^.secrets.baseline$' | xargs -n 100 detect-secrets-hook --baseline .secrets.baseline
      - run: python -m pip install -e "apps/desktop[dev]"
      - name: Run mock-only test suite
        shell: bash
        run: |
          extra_args=()
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            # These legacy tests instantiate Tk or exercise the Windows-only
            # os.startfile API despite not carrying the gui marker.
            extra_args+=(
              --ignore=apps/desktop/tests/test_file_operations_gui.py
              --ignore=apps/desktop/tests/test_settings_persistence.py
              --ignore=apps/desktop/tests/test_settings_persistence_root_cause.py
            )
          fi
          python -m pytest apps/desktop/tests \
            -m "not integration and not gui and not slow" \
            --no-cov "${extra_args[@]}"
